<!DOCTYPE html>
<html>
<head>
  <title>Editar Receita</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container">
  <h1 class="my-4">Editar Receita</h1>

  <!-- Formulário para editar receita -->
  <form action="/editar/{{ receita._id }}" method="POST">
    <div class="form-group">
      <input type="text" name="nome" class="form-control" value="{{ receita.nome }}" required>
    </div>
    <div class="form-group">
      <textarea name="ingredientes" class="form-control" required>{{ receita.ingredientes | join(', ') }}</textarea>
    </div>
    <div class="form-group">
      <textarea name="instrucoes" class="form-control" required>{{ receita.instrucoes }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
    <a href="/" class="btn btn-secondary">Cancelar</a>
  </form>
</body>
</html>
